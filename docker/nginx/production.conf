# finot FastAPI app; it differentiates landing vs app by host/route.
server {
    listen 80;
    listen [::]:80;
    server_name fi-note.app chat.fi-note.app;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}
