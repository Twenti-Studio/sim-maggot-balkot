# ═══════════════════════════════════════════════════════════════════
# Twenti Studio products (added 2026-07-13) — each proxied to its own
# isolated stack. Upstreams use the Docker embedded resolver (127.0.0.11)
# with VARIABLE proxy_pass targets, so nginx resolves them per-request
# instead of at startup. That means: if a product container is down or
# not yet attached to the edge network, only THAT domain returns 502 —
# the proxy still starts/reloads and all other sites keep working.
# ipv6=off avoids AAAA SERVFAIL on docker aliases.
# ═══════════════════════════════════════════════════════════════════

# ---- games.twenti.studio -> Games-Twenti (gametwenti-app:3001) ----
server {
    listen 80;
    server_name games.twenti.studio;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    http2 on;
    server_name games.twenti.studio;
    charset utf-8;
    client_max_body_size 20m;

    ssl_certificate     /etc/letsencrypt/live/games.twenti.studio/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/games.twenti.studio/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    resolver 127.0.0.11 valid=30s ipv6=off;
    set $up_games gametwenti-app:3001;

    location / {
        proxy_pass http://$up_games;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

