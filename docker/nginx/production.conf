# ---- mita.twenti.studio -> Tasky (frontend :3000, api/uploads -> backend :5000) ----
server {
    listen 80;
    server_name mita.twenti.studio;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    http2 on;
    server_name mita.twenti.studio;
    charset utf-8;
    client_max_body_size 30m;

    ssl_certificate     /etc/letsencrypt/live/mita.twenti.studio/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mita.twenti.studio/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    resolver 127.0.0.11 valid=30s ipv6=off;
    set $up_tasky_fe tasky-frontend:3000;
    set $up_tasky_be tasky-backend:5000;

    # API + uploads are served by the Express backend
    location /api/ {
        proxy_pass http://$up_tasky_be;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
    location /uploads/ {
        proxy_pass http://$up_tasky_be;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }
    # Everything else is the Next.js frontend
    location / {
        proxy_pass http://$up_tasky_fe;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

# ---- fi-note.app (landing) + chat.fi-note.app (chat app) -> finot (finot-bot:8000) ----
