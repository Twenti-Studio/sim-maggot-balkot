name: sim-rumah-maggot

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - app_public_uploads:/var/www/html/storage/app/public
      - app_logs:/var/www/html/storage/logs
    networks: [maggot]

  queue:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["php", "artisan", "queue:work", "--sleep=3", "--tries=3", "--timeout=90"]
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - app_public_uploads:/var/www/html/storage/app/public
      - app_logs:/var/www/html/storage/logs
    networks: [maggot]

  web:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
    restart: unless-stopped
    depends_on: [app]
    ports:
      - "127.0.0.1:8091:80"
    volumes:
      - app_public_uploads:/var/www/html/public/storage:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/up >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks: [maggot]

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [maggot]

networks:
  maggot:
    driver: bridge

volumes:
  postgres_data:
  app_public_uploads:
  app_logs:
